<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TNS — состояние</title>
    <!-- Зелёная точка вкладки: без файла браузер просит /favicon.ico и получает 404. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!--
        Исходник стилей — Less. less.js компилирует его в браузере,
        поэтому сборщик для CSS не нужен. Скрипт идёт сразу после link:
        он ищет все ссылки с rel="stylesheet/less".
    -->
    <link rel="stylesheet/less" type="text/css" href="/style.less">
    <script src="/vendor/less.js"></script>
</head>
<body>
    <!--
        Шаблон wex. Движок читает его содержимое как виртуальное дерево
        и вставляет отрисованный результат после самого <template>.
        Идентификатор app — точка привязки для $('#app') в app.js.
    -->
    <template id="app">
        <main class="panel">
            <!--
                Шапка не зависит от стейта, поэтому помечена w-static:
                перерисовки её не касаются.
            -->
            <header class="head" w-static>
                <h1 class="title">TrueNeverStory</h1>
                <p class="lead">
                    Мир, который отвечает текстом. Для первого запуска нужны
                    три модели и llama.cpp: всё работает на этом компьютере,
                    и текст никуда не отправляется.
                </p>
            </header>

            <p class="failure" w-if="failure">{{ failure }}</p>

            <nav class="steps">
                <span class="step" w-on="click:toModels"
                      w-class="{ 'current': step === 'models', 'done': step !== 'models' }">Модели</span>
                <span class="step" w-class="{ 'current': step === 'world' }">Мир</span>
            </nav>

            <section class="block" w-if="step === 'models'">
                <h2 class="caption">
                    Скачивание моделей
                    <span class="engine">domains/models</span>
                </h2>
                <p class="note">
                    Для игры нужны три модели и сервер. Сервер — это
                    llama.cpp: он запускает модели локально, текст никуда не
                    отправляется. Модели разные: одна пишет прозу, вторая
                    понимает смысл ваших реплик, третья разбирает начало
                    главы.
                </p>
                <p class="note">
                    Выберите, что скачивать. Модель занимает место и на диске,
                    и в памяти при работе. Понимание нужно постоянно, поэтому
                    его вариант выбирают по памяти компьютера; писать может
                    только одна модель за раз.
                </p>

                <p class="server" w-class="{ 'ok': models.server.found }">
                    <span class="dot"></span>
                    <span w-if="models.server.found">Сервер на месте: {{ models.server.path }}</span>
                    <span w-if="!models.server.found">{{ models.server.title }} — скачается вместе с моделями</span>
                </p>

                <div class="cards">
                    <article class="card" w-for="slot in models.slots traceby slot.role"
                             w-class="{ 'off': !slot.enabled }">
                        <div class="head" data-role="{{ slot.role }}" w-on="click:toggleRole">
                            <span class="check">{{ slot.enabled ? '✓' : '' }}</span>
                            <span class="title">{{ slot.title }}</span>
                        </div>
                        <p class="note">{{ slot.note }}</p>
                        <div class="variant" w-for="v in slot.variants traceby v.id"
                             w-class="{ 'chosen': slot.chosen === v.id, 'done': v.installed }"
                             data-role="{{ slot.role }}" data-variant="{{ v.id }}"
                             w-on="click:chooseVariant">
                            <span class="title">{{ v.title }}</span>
                            <span class="meta">{{ v.installed ? 'уже на месте' : v.sizeText }}</span>
                            <span class="meta">память ≈ {{ v.ramText }}</span>
                        </div>
                    </article>
                </div>

                <div class="plan">
                    <p><span class="hint">Память при работе</span> ≈ {{ plan.ramText }}</p>
                    <p w-class="{ 'error': !plan.enough }">
                        <span class="hint">Свободно на диске</span> {{ diskText }}
                        <span w-if="!plan.enough">— этого мало</span>
                    </p>
                </div>

                <div class="paths" w-if="plan.paths.length">
                    <p class="label">Куда</p>
                    <p class="path" w-for="row in plan.paths traceby row.title">
                        <span class="title">{{ row.title }}</span>
                        <code>{{ row.path }}</code>
                    </p>
                </div>

                <div class="downloads">
                    <p class="label">Загрузка</p>
                    <div class="download" w-for="row in downloads.items traceby row.key">
                        <div class="head">
                            <span class="title">{{ row.title }}</span>
                            <span class="meta">{{ row.state }}</span>
                        </div>
                        <div class="bar"><div class="fill" style="width: {{ row.percent }}%"></div></div>
                        <p class="meta" w-if="row.progressText">{{ row.progressText }}</p>
                        <p class="meta error" w-if="row.error">{{ row.error }}</p>
                    </div>
                </div>

                <div class="actions">
                    <button class="button" w-on="click:startDownload"
                            w-disabled="downloads.active || (!plan.bytes && models.server.found)">
                        Скачать выбранные
                    </button>
                    <span class="status" w-class="{ 'ok': !plan.bytes && models.server.found }">{{ plan.status }}</span>
                    <button class="button" w-on="click:toWorld" w-disabled="!models.ready">Далее</button>
                </div>
            </section>

            <section class="block" w-if="step === 'world'">
                <h2 class="caption">
                    Настройка мира
                    <span class="engine">domains/world</span>
                </h2>
                <p class="note">
                    Отвечать долго не нужно: названия, нескольких слов о мире
                    и выбора из списков хватит. Всё остальное уточнится позже.
                </p>

                <div class="created" w-if="created">
                    <p>Мир «{{ created.title }}» создан, адрес — {{ created.slug }}.</p>
                    <p class="hint">
                        Дальше — рождение героя и первый ход. Это следующая
                        работа переезда.
                    </p>
                </div>

                <div class="form" w-if="!created">
                    <div class="field">
                        <span class="label">Название мира</span>
                        <input class="input" w-bind="world.title" placeholder="Тёмное королевство">
                        <p class="reason" w-if="world.errors.title">{{ world.errors.title }}</p>
                    </div>

                    <div class="field">
                        <span class="label">Адрес мира</span>
                        <input class="input" w-bind="world.slug" placeholder="dark-realm">
                        <p class="hint">Латиницей, цифрами и дефисом: так мир называется в файлах.</p>
                        <p class="reason" w-if="world.errors.slug">{{ world.errors.slug }}</p>
                    </div>

                    <div class="field">
                        <span class="label">О чём история</span>
                        <textarea class="input" rows="3" w-bind="world.synopsis"
                                  placeholder="Король умер, наследник пропал. Страна ждёт."></textarea>
                        <p class="hint">Одно-три предложения: это не план, а заявка.</p>
                        <p class="reason" w-if="world.errors.synopsis">{{ world.errors.synopsis }}</p>
                    </div>

                    <div class="field">
                        <span class="label">Жанры</span>
                        <div class="chips">
                            <span class="chip" w-for="item in world.genres traceby item.title"
                                  w-class="{ 'on': item.on }" data-value="{{ item.title }}"
                                  w-on="click:toggleGenre">{{ item.title }}</span>
                        </div>
                        <p class="reason" w-if="world.errors.genres">{{ world.errors.genres }}</p>
                    </div>

                    <div class="field">
                        <span class="label">Строй мира</span>
                        <div class="chips">
                            <span class="chip" w-for="item in world.orders traceby item.title"
                                  w-class="{ 'on': item.on }" data-list="orders" data-value="{{ item.title }}"
                                  w-on="click:pickOne">{{ item.title }}</span>
                        </div>
                        <p class="reason" w-if="world.errors.social_order">{{ world.errors.social_order }}</p>
                    </div>

                    <div class="field">
                        <span class="label">Карта мира</span>
                        <div class="chips">
                            <span class="chip" w-for="item in world.modes traceby item.title"
                                  w-class="{ 'on': item.on }" data-list="modes" data-value="{{ item.title }}"
                                  w-on="click:pickOne">{{ item.title }}</span>
                        </div>
                        <p class="reason" w-if="world.errors.travel_mode">{{ world.errors.travel_mode }}</p>
                    </div>

                    <div class="field">
                        <span class="label">Возрастной рейтинг</span>
                        <div class="chips">
                            <span class="chip" w-for="item in world.ratings traceby item.title"
                                  w-class="{ 'on': item.on }" data-list="ratings" data-value="{{ item.title }}"
                                  w-on="click:pickOne">{{ item.title }}</span>
                        </div>
                        <p class="hint">Рейтинг решает, какие слова не попадут в текст.</p>
                        <p class="reason" w-if="world.errors.censorship">{{ world.errors.censorship }}</p>
                    </div>

                    <div class="line">
                        <button class="button" w-on="click:createWorld">Создать мир</button>
                        <button class="button" w-on="click:toModels">Назад</button>
                    </div>
                </div>
            </section>

        </main>
    </template>

    <!--
        Порядок важен: jQuery, затем wex, затем код приложения.

        У wex 3 есть свой мини-$, и библиотека работает без jQuery. Проект
        пока подключает jQuery первым: wex его подхватывает, и `$el`
        в директивах остаётся полным jQuery. Проверенная связка важнее
        экономии восьмидесяти килобайт: отказ от jQuery — отдельная правка
        с проверкой всех экранов, а не побочный эффект обновления.
    -->
    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/wex.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
