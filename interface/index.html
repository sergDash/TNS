<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TNS — состояние</title>
    <!-- Зелёная точка вкладки: без файла браузер просит /favicon.ico и получает 404. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!--
        Исходник стилей — Less. less.js компилирует его в браузере,
        поэтому сборщик для CSS не нужен. Скрипт идёт сразу после link:
        он ищет все ссылки с rel="stylesheet/less".
    -->
    <link rel="stylesheet/less" type="text/css" href="/style.less">
    <script src="/vendor/less.js"></script>
</head>
<body>
    <!--
        Шаблон wex. Движок читает его содержимое как виртуальное дерево
        и вставляет отрисованный результат после самого <template>.
        Идентификатор app — точка привязки для $('#app') в app.js.
    -->
    <template id="app">
        <main class="panel">
            <!--
                Шапка не зависит от стейта, поэтому помечена w-static:
                перерисовки её не касаются.
            -->
            <header class="head" w-static>
                <h1 class="title">TrueNeverStory</h1>
                <p class="lead">
                    Мир, который отвечает текстом. Для первого запуска нужны
                    три модели и llama.cpp: всё работает на этом компьютере,
                    и текст никуда не отправляется.
                </p>
            </header>

            <p class="failure" w-if="failure">{{ failure }}</p>

            <section class="block">
                <h2 class="caption">
                    Скачивание моделей
                    <span class="engine">domains/models</span>
                </h2>
                <p class="note">
                    Для игры нужны три модели и сервер. Сервер — это
                    llama.cpp: он запускает модели локально, текст никуда не
                    отправляется. Модели разные: одна пишет прозу, вторая
                    понимает смысл ваших реплик, третья разбирает начало
                    главы.
                </p>
                <p class="note">
                    Выберите, что скачивать. Модель занимает место и на диске,
                    и в памяти при работе. Понимание нужно постоянно, поэтому
                    его вариант выбирают по памяти компьютера; писать может
                    только одна модель за раз.
                </p>

                <p class="server" w-class="{ 'ok': models.server.found }">
                    <span class="dot"></span>
                    <span w-if="models.server.found">Сервер на месте: {{ models.server.path }}</span>
                    <span w-if="!models.server.found">{{ models.server.title }} — скачается вместе с моделями</span>
                </p>

                <div class="cards">
                    <article class="card" w-for="slot in models.slots traceby slot.role"
                             w-class="{ 'off': !slot.enabled }">
                        <div class="head" data-role="{{ slot.role }}" w-on="click:toggleRole">
                            <span class="check">{{ slot.enabled ? '✓' : '' }}</span>
                            <span class="title">{{ slot.title }}</span>
                        </div>
                        <p class="note">{{ slot.note }}</p>
                        <div class="variant" w-for="v in slot.variants traceby v.id"
                             w-class="{ 'chosen': slot.chosen === v.id, 'done': v.installed }"
                             data-role="{{ slot.role }}" data-variant="{{ v.id }}"
                             w-on="click:chooseVariant">
                            <span class="title">{{ v.title }}</span>
                            <span class="meta">{{ v.installed ? 'уже на месте' : v.sizeText }}</span>
                            <span class="meta">память ≈ {{ v.ramText }}</span>
                        </div>
                    </article>
                </div>

                <div class="plan">
                    <p><span class="hint">К скачиванию</span> {{ plan.text }}</p>
                    <p><span class="hint">Память при работе</span> ≈ {{ plan.ramText }}</p>
                    <p w-class="{ 'error': !plan.enough }">
                        <span class="hint">Свободно на диске</span> {{ diskText }}
                        <span w-if="!plan.enough">— этого мало</span>
                    </p>
                </div>

                <div class="line">
                    <button class="button" w-disabled="true">Начать скачивание</button>
                    <span class="hint">
                        Кнопка включится, когда появится загрузчик: сначала
                        видно, что и сколько будет скачано.
                    </span>
                </div>
            </section>

            <section class="block">
                <h2 class="caption">
                    Состояние процесса
                    <span class="engine">engine/httpapi</span>
                </h2>
                <p class="note">
                    Ответ приходит в общем конверте: данные в result, ошибка
                    в error, — поэтому клиенту не нужно угадывать форму.
                    Кнопка повторяет запрос <code>GET /api/health</code>,
                    чтобы его было видно в сетевой панели инструментов.
                    По версии понятно, какая сборка запущена.
                </p>
                <div class="probe">
                    <p class="status" w-class="{ 'ok': ok, 'error': !checking && !ok }">
                        <span class="dot"></span>{{ status }}
                    </p>
                    <button class="button" w-on="click:check" w-disabled="checking">Проверить</button>
                </div>
                <p class="label" w-if="version">версия {{ version }}</p>
            </section>

            <footer class="actions">
                <button class="button" w-on="click:refresh" w-disabled="checking">
                    Обновить всё
                </button>
                <span class="hint">
                    Перечитывает каталог и состояние процесса. Опроса нет:
                    данные меняются только после нажатия, пока не сделан
                    канал обновлений (шаг «Поток в интерфейсе»).
                </span>
            </footer>
        </main>
    </template>

    <!--
        Порядок важен: jQuery, затем wex, затем код приложения.

        У wex 3 есть свой мини-$, и библиотека работает без jQuery. Проект
        пока подключает jQuery первым: wex его подхватывает, и `$el`
        в директивах остаётся полным jQuery. Проверенная связка важнее
        экономии восьмидесяти килобайт: отказ от jQuery — отдельная правка
        с проверкой всех экранов, а не побочный эффект обновления.
    -->
    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/wex.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
